name: Sagemcom publisher proof

on:
  pull_request:
    types: [synchronize]
    paths:
      - Dockerfile
      - .github/workflows/sagemcom-publisher-proof.yml
      - .github/ci/sagemcom-publisher-proof.sh
      - .github/ci/sagemcom-runtime-smoke.py

permissions:
  contents: read

jobs:
  publisher-proof:
    if: github.event.pull_request.number == 100 && github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Check out the exact draft head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare publisher inputs and runtime scans
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/ci/sagemcom-publisher-proof.sh
